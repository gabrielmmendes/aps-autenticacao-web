<svg xmlns="http://www.w3.org/2000/svg" width="720" height="718" viewBox="0 0 720 718"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker><marker id="arro" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><line x1="70.0" y1="76" x2="70.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><circle cx="70.0" cy="44" r="7" fill="#fff" stroke="#222"/><path d="M70.0,51 v14 M60.0,58 h20 M70.0,65 l-8,10 M70.0,65 l8,10" stroke="#222" fill="none"/><text x="70.0" y="88" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">Usuário</text><line x1="186.0" y1="76" x2="186.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><rect x="147.4" y="42" width="77.19999999999999" height="24" rx="3" fill="#e8f0fb" stroke="#333"/><text x="186.0" y="58" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">Navegador</text><line x1="302.0" y1="76" x2="302.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><rect x="283.8" y="42" width="36.4" height="24" rx="3" fill="#eef6ea" stroke="#333"/><text x="302.0" y="58" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">DNS</text><line x1="418.0" y1="90" x2="418.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><rect x="369.2" y="42" width="97.6" height="38" rx="3" fill="#eef6ea" stroke="#333"/><text x="418.0" y="58" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">Servidor Web</text><text x="418.0" y="72" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">(Nginx)</text><line x1="534.0" y1="90" x2="534.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><rect x="488.6" y="42" width="90.8" height="38" rx="3" fill="#fbefe2" stroke="#333"/><text x="534.0" y="58" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">Servidor de</text><text x="534.0" y="72" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">aplicação</text><line x1="650.0" y1="76" x2="650.0" y2="708" stroke="#888" stroke-dasharray="4,4"/><rect x="628.4" y="42" width="43.2" height="24" rx="3" fill="#f3e9f7" stroke="#333"/><text x="650.0" y="58" font-size="11.5" text-anchor="middle" font-family="Liberation Sans" font-weight="bold">SGBD</text><line x1="70.0" y1="120" x2="186.0" y2="120" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="128.0" y="115" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">1. informa https://auth.example.com/</text><line x1="186.0" y1="150" x2="302.0" y2="150" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="244.0" y="145" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">2. consulta registros A/AAAA</text><line x1="302.0" y1="180" x2="186.0" y2="180" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="244.0" y="175" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">3. endereço IP + TTL</text><line x1="186.0" y1="210" x2="418.0" y2="210" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="302.0" y="205" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">4. conexão TCP (SYN, SYN-ACK, ACK) porta 443</text><line x1="186.0" y1="240" x2="418.0" y2="240" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="302.0" y="235" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">5. TLS 1.3: ClientHello (SNI, ALPN)</text><line x1="418.0" y1="270" x2="186.0" y2="270" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="302.0" y="265" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">6. ServerHello, certificado, Finished</text><line x1="186.0" y1="300" x2="418.0" y2="300" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="302.0" y="295" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">7. GET / (HTTP/2)</text><path d="M418.0,322 h28 v14 h-26" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="452.0" y="333" font-size="11.5" font-family="Liberation Sans">8. seleciona server/location; lê arquivo</text><line x1="418.0" y1="366" x2="186.0" y2="366" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="302.0" y="361" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">9. 200 OK text/html (+ CSS, JS)</text><path d="M186.0,388 h28 v14 h-26" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="220.0" y="399" font-size="11.5" font-family="Liberation Sans">10. constrói DOM/CSSOM e renderiza</text><line x1="70.0" y1="432" x2="186.0" y2="432" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="128.0" y="427" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">11. preenche credenciais e aciona Entrar</text><line x1="186.0" y1="462" x2="418.0" y2="462" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="302.0" y="457" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">12. POST /api/v1/autenticacoes (JSON)</text><line x1="418.0" y1="492" x2="534.0" y2="492" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="476.0" y="487" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">13. proxy_pass (HTTP/1.1 local)</text><path d="M534.0,514 h28 v14 h-26" fill="none" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="528.0" y="525" font-size="11.5" text-anchor="end" font-family="Liberation Sans">14. thread do pool → filtros → servlet</text><line x1="534.0" y1="558" x2="650.0" y2="558" stroke="#222" stroke-width="1.2" marker-end="url(#arr)"/><text x="592.0" y="553" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">15. consulta SQL (JDBC)</text><line x1="650.0" y1="588" x2="534.0" y2="588" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="592.0" y="583" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">16. linhas resultantes</text><line x1="534.0" y1="618" x2="418.0" y2="618" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="476.0" y="613" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">17. 200 ou 401 (application/json)</text><line x1="418.0" y1="648" x2="186.0" y2="648" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="302.0" y="643" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">18. resposta encaminhada + log de acesso</text><line x1="186.0" y1="678" x2="70.0" y2="678" stroke="#222" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arro)"/><text x="128.0" y="673" font-size="11.5" text-anchor="middle" font-family="Liberation Sans">19. atualiza o DOM com o resultado</text></svg>